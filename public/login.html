<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · CINEVERSE</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 15%,#38285c66,transparent 45%),var(--bg)}.login-card{width:min(420px,100%);padding:38px;border:1px solid #9b7cff42;border-radius:15px;background:#12141df2;box-shadow:0 30px 100px #0009}.login-brand{display:flex;justify-content:center;margin-bottom:30px}.login-title{text-align:center;font:600 29px var(--display);margin:0 0 8px}.login-sub{text-align:center;color:#9999a9;font-size:11px;line-height:1.7;margin-bottom:25px}.login-card input,.login-card button{width:100%;height:46px;border-radius:7px}.login-card input{background:#090b12;border:1px solid #ffffff20;color:white;padding:0 13px;outline:none}.login-card input:focus{border-color:#9b7cff}.login-card button{border:0;background:linear-gradient(110deg,#b5a0ff,#8e70f2);color:#171224;font-weight:700;margin-top:11px}.login-card button.alt{background:transparent;color:#aaa;border:1px solid #ffffff20;font-weight:500}.login-msg{min-height:18px;color:#c8baff;font-size:10px;text-align:center;margin-top:14px}.brand-back{display:inline-flex;gap:9px;align-items:center;color:#eee;text-decoration:none;font:700 16px var(--display);letter-spacing:1px}.brand-back b{color:var(--purple)}.login-mark{width:30px;height:30px;display:grid;place-items:center;background:linear-gradient(145deg,#b39aff,#7254d8);color:#100e19;border-radius:9px;font-size:20px}.hidden{display:none!important}</style></head><body><main class="login-card"><div class="login-brand"><a class="brand-back" href="/"><span class="login-mark">C</span>CINE<b>VERSE</b></a></div><h1 class="login-title" id="heading">Enter your universe.</h1><p class="login-sub" id="sub">Sign in or create your free cinephile account. We'll email you a one-time code — no password needed.</p><form id="form"><input id="email" type="email" placeholder="Your email address" autocomplete="username webauthn" required><input id="code" class="hidden" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="submit">Continue with email</button><button type="button" id="back" class="alt hidden">Use a different email</button></form><div id="passkey" class="hidden"><p class="login-sub">Add a passkey and next time sign in with your fingerprint, face, or screen lock.</p><button id="addPasskey">Add a passkey</button><button id="skipPasskey" class="alt">Not now</button></div><p class="login-msg" id="msg" role="status"></p></main><script>(()=>{const A=window.hatchable?.auth,$=id=>document.getElementById(id);if(!A){$("msg").textContent="Sign-in is unavailable. Refresh and try again.";return}let step="email",hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get("next")||"/";location.replace(n.startsWith("/")&&!n.startsWith("//")&&!n.includes("\\")?n:"/")};const say=t=>$("msg").textContent=t;A.getSession().then(s=>{if(s?.user)next()}).catch(()=>{});$("back").onclick=()=>{step="email";$("email").classList.remove("hidden");$("code").classList.add("hidden");$("back").classList.add("hidden");$("submit").textContent="Continue with email";$("sub").textContent="We'll email you a one-time code — no password needed.";say("")};$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{if(step==="email"){const email=$("email").value.trim();const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{await A.signInWithPasskey({email});return next()}catch{}}step="code";$("email").classList.add("hidden");$("code").classList.remove("hidden");$("back").classList.remove("hidden");$("submit").textContent="Verify and sign in";$("sub").textContent="Enter the six-digit code sent to "+email;$("heading").textContent="Check your inbox.";say("Your sign-in code is on its way.");$("code").focus()}else{const r=await A.verifyCode({email:$("email").value.trim(),code:$("code").value.trim()});if(!r.user)throw Error("That code did not work.");if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem("cv_passkey_declined")!=="1"){$("form").classList.add("hidden");$("passkey").classList.remove("hidden");$("heading").textContent="One less thing to remember.";return}next()}}catch(err){say(err.message||"Something went wrong. Try again.")}finally{$("submit").disabled=false}};$("addPasskey").onclick=async()=>{try{await A.registerPasskey();next()}catch(e){say(e.message||"Could not add passkey.")}};$("skipPasskey").onclick=()=>{localStorage.setItem("cv_passkey_declined","1");next()};if(A.attachPasskeyAutofill)A.attachPasskeyAutofill($("email")).then(r=>{if(r?.user)next()}).catch(()=>{})})();</script></body></html>
